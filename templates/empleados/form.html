{% extends "base.html" %}

{% block content %}
<div class="bg-white border-b border-gray-300 px-6 py-3 flex justify-between items-center shadow-sm mb-6">
    <div class="flex items-center text-sm text-gray-500">
        <a href="/" class="hover:text-blue-600">Inicio</a>
        <span class="mx-2">/</span>
        <a href="{{ url_for('empleados.lista') }}" class="hover:text-blue-600">Empleados</a>
        <span class="mx-2">/</span>
        <span class="font-bold text-gray-800">Nuevo Empleado</span>
    </div>
    <div class="flex space-x-2">
        <a href="{{ url_for('empleados.lista') }}" class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded hover:bg-gray-50">Descartar</a>
        <button type="submit" form="form-empleado" class="px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded hover:bg-blue-700 shadow">Guardar Empleado</button>
    </div>
</div>

<div class="max-w-4xl mx-auto bg-white p-8 rounded-lg shadow-md border border-gray-200">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="mb-4 p-3 rounded {{ 'bg-green-100 text-green-800' if category == 'success' else 'bg-red-100 text-red-800' }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form id="form-empleado" method="POST" action="{{ url_for('empleados.nuevo') }}">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            
            <!-- COLUMNA IZQUIERDA -->
            <div class="space-y-6">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Nombre Completo *</label>
                    <input type="text" name="nombre" required class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
                </div>
                
                <!-- DROPDOWN DE PUESTOS -->
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Puesto / Cargo</label>
                    <select name="puesto_id" class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 bg-white">
                        <option value="">Sin puesto asignado</option>
                        {% for p in puestos %}
                            <option value="{{ p[0] }}">{{ p[1] }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Salario Base (C$) *</label>
                    <input type="number" step="0.01" name="salario" required class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
                </div>
            </div>

            <!-- COLUMNA DERECHA -->
            <div class="space-y-6">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Fecha de Contratación *</label>
                    <input type="date" name="fecha_contratacion" required class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
                </div>

                <div class="flex items-center mt-8 bg-gray-50 p-4 rounded border border-gray-200">
                    <input type="checkbox" name="activo" checked class="w-5 h-5 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
                    <label class="ml-3 block text-sm font-bold text-gray-700">Empleado Activo (Puede facturar y acceder)</label>
                </div>
            </div>
        </div>
    </form>
</div>
{% endblock %}
