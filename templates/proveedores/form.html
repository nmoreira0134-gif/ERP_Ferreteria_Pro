{% extends "base.html" %}

{% block content %}
<div class="container mx-auto px-4 py-8 max-w-2xl">
    <h1 class="text-2xl font-bold text-gray-800 mb-6">
        {% if proveedor %} Editar Proveedor {% else %} Nuevo Proveedor {% endif %}
    </h1>

    <div class="bg-white shadow-md rounded p-6">
        <form method="POST">
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2">Nombre de la Empresa:</label>
                <input type="text" name="nombre" value="{{ proveedor.Nombre if proveedor else '' }}" required class="shadow border rounded w-full py-2 px-3 text-gray-700">
            </div>

            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2">Persona de Contacto:</label>
                <input type="text" name="contacto" value="{{ proveedor.Contacto if proveedor else '' }}" class="shadow border rounded w-full py-2 px-3 text-gray-700">
            </div>

            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2">Teléfono:</label>
                <input type="text" name="telefono" value="{{ proveedor.Telefono if proveedor else '' }}" class="shadow border rounded w-full py-2 px-3 text-gray-700">
            </div>

            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-bold mb-2">Email:</label>
                <input type="email" name="email" value="{{ proveedor.Email if proveedor else '' }}" class="shadow border rounded w-full py-2 px-3 text-gray-700">
            </div>

            <div class="flex items-center justify-between">
                <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
                    Guardar Proveedor
                </button>
                <a href="{{ url_for('proveedores.lista') }}" class="text-gray-600 hover:text-gray-800 font-medium">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
