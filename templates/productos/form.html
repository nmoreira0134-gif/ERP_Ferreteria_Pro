{% extends "base.html" %}

{% block content %}
<div class="container mx-auto px-4 py-8 max-w-2xl">
    <h1 class="text-2xl font-bold text-gray-800 mb-6">
        {% if producto %} Editar Producto {% else %} Nuevo Producto {% endif %}
    </h1>

    <div class="bg-white shadow-md rounded p-6">
        <form method="POST">
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2">Nombre:</label>
                <input type="text" name="nombre" value="{{ producto.Nombre if producto else '' }}" required class="shadow border rounded w-full py-2 px-3 text-gray-700">
            </div>

            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2">SKU:</label>
                <input type="text" name="sku" value="{{ producto.SKU if producto else '' }}" required class="shadow border rounded w-full py-2 px-3 text-gray-700">
            </div>

            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2">Precio Unitario:</label>
                <input type="number" step="0.01" name="precio" value="{{ producto.PrecioUnitario if producto else '' }}" required class="shadow border rounded w-full py-2 px-3 text-gray-700">
            </div>

            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2">Unidad de Medida:</label>
                <input type="text" name="unidad_medida" value="{{ producto.UnidadMedida if producto else '' }}" class="shadow border rounded w-full py-2 px-3 text-gray-700">
            </div>

            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2">Proveedor (Opcional):</label>
                <select name="proveedor_id" class="shadow border rounded w-full py-2 px-3 text-gray-700">
                    <option value="">-- Sin Proveedor --</option>
                    {% for prov in proveedores %}
                        <option value="{{ prov.ProveedorID }}" {% if producto and producto.ProveedorID == prov.ProveedorID %}selected{% endif %}>
                            {{ prov.Nombre }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-bold mb-2">Código de Proveedor (Opcional):</label>
                <input type="text" name="codigo_proveedor" value="{{ producto.CodigoProveedor if producto else '' }}" class="shadow border rounded w-full py-2 px-3 text-gray-700">
            </div>

            <div class="flex items-center justify-between">
                <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
                    Guardar
                </button>
                <a href="{{ url_for('productos.lista') }}" class="text-gray-600 hover:text-gray-800 font-medium">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
